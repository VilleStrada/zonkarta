<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zonkarta nya kunder - Avfallskonsulten</title>
<style>
  :root{--p1:#1f7a45;--ink:#1d2a33;--muted:#5d6b75;--bg:#f4f6f8;--line:#dfe4e8}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  body{display:flex;align-items:center;justify-content:center;padding:24px 16px;min-height:100vh}
  .kort{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:100%;max-width:400px;box-shadow:0 8px 30px rgba(29,42,51,.08)}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.45}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input[type=password]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
  input[type=password]:focus{outline:2px solid var(--p1);outline-offset:-1px}
  .rad{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:12px 0 16px}
  button{width:100%;font:inherit;font-size:14px;font-weight:600;padding:11px;border-radius:8px;border:0;background:var(--p1);color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .fel{color:#a3321f;font-size:13px;margin-top:10px;min-height:18px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:18px;margin-bottom:0}
</style>
</head>
<body>
<form class="kort" id="f">
  <h1>Zonkarta nya kunder</h1>
  <p>Avfallskonsultens karta för samarbetet med Wasteless. Ange lösenordet ni fått från Avfallskonsulten.</p>
  <label for="pw">Lösenord</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus>
  <div class="rad"><input type="checkbox" id="minns" checked><label for="minns" style="margin:0;font-weight:500">Kom ihåg i 12 timmar på den här enheten</label></div>
  <button type="submit" id="b">Öppna kartan</button>
  <div class="fel" id="fel"></div>
  <p class="foot">Kartan är krypterad och låses upp i din webbläsare. Frågor: ville@avfallskonsulten.se</p>
</form>

const LS = "ak_zonkarta_pw";
const GILTIG_MS = 12 * 3600 * 1000; // sparat lösenord gäller 12 timmar
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function lasUpp(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.salt), iterations:D.varv, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, key, b64(D.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, b = document.getElementById("b"), fel = document.getElementById("fel");
  b.disabled = true; b.textContent = "Låser upp…"; fel.textContent = "";
  try {
    if (document.getElementById("minns").checked) { try { localStorage.setItem(LS, JSON.stringify({pw, t: Date.now()})); } catch(x){} }
    await lasUpp(pw);
  } catch (x) {
    try { localStorage.removeItem(LS); } catch(y){}
    fel.textContent = "Fel lösenord. Försök igen.";
    b.disabled = false; b.textContent = "Öppna kartan";
  }
};
(async () => {
  let pw = null;
  try { const sp = JSON.parse(localStorage.getItem(LS) || "null"); if (sp && sp.pw && Date.now() - sp.t < GILTIG_MS) pw = sp.pw; else localStorage.removeItem(LS); } catch(x){}
  if (pw) { try { await lasUpp(pw); } catch(x) { try { localStorage.removeItem(LS); } catch(y){} } }
})();
})();
